<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodpile Tool</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- ====================== Styles ====================== -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Split layout, full viewport height */
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Left: fixed-width control panel */
    #panel {
      width: 260px;
      flex: 0 0 260px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
    }

    /* Right: canvas host fills remaining width */
    #canvas-host {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
    }

    #panel-logo {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }

    /* Section divider (e.g. Physics) */
    .section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }
    .section h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 16px;
      color: #070707;
    }

    .control { margin-bottom: 22px; }
    .control label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .control .value {
      font-weight: 400;
      color: #888;
      text-transform: none;
      letter-spacing: 0;
    }

    /* Custom range sliders: blue fill + thumb, plain grey unfilled track,
       no border/contour. WebKit fill is painted via a JS gradient
       (paintRangeFill); Firefox uses ::-moz-range-progress. */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #d8d8d8;   /* unfilled track, no border */
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: #007CFF; border: none; cursor: pointer;
      margin-top: -6px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #007CFF; border: none; cursor: pointer;
    }
    input[type="range"]::-moz-range-track {
      height: 4px; border-radius: 2px; background: #d8d8d8; border: none;
    }
    input[type="range"]::-moz-range-progress {
      height: 4px; border-radius: 2px; background: #007CFF;
    }

    /* "Save settings" checkbox row */
    .checkbox-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .checkbox-control input { cursor: pointer; }


    /* Action buttons */
    .action {
      width: 100%;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
      border: 1px solid #007CFF;
      background: #007CFF;
      color: #fff;
    }
    .action.secondary {
      background: #fff;
      border: 1px solid #007CFF;
      color: #007CFF;
    }

    /* Upload error message */
    .error {
      color: #c0392b;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* Disabled state for any control */
    button:disabled,
    input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Transparent text-input overlay sitting on top of the p5 canvas.
       The text itself is invisible (p5 draws the glyphs); only the
       caret is visible so the user can see where they're typing. */
    #text-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 80px;
      margin: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: transparent;
      caret-color: #070707;
      font-family: 'UploadedFont', sans-serif;
      font-size: 150px;
      line-height: 1.2;
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      z-index: 2;
    }
    #text-input::selection { background: rgba(7, 7, 7, 0.12); }

    /* Upload button + drop hint, centred on the canvas just below the
       placeholder text. Shown only while no font is loaded. */
    #upload-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 32px);
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }
    #upload-overlay #upload-btn { margin-bottom: 0; }
    #drop-hint {
      font-size: 13px;
      color: #bababa;
      text-align: center;
    }
    /* Subtle dashed hint while a font file is dragged over the canvas.
       Applied from JS via classList in the drag handlers. */
    /*noinspection CssUnusedSymbol*/
    #canvas-host.drag-active {
      outline: 2px dashed #bababa;
      outline-offset: -12px;
    }

    /* Upload button lays out an optional icon beside its label. */
    #upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #upload-btn svg { flex: none; }

    /* Social links overlaid on the canvas area, bottom-right */
    #social-icons {
      position: absolute;
      bottom: 80px;
      right: 80px;
      display: flex;
      flex-direction: row;
      gap: 10px;
      z-index: 10;
    }
    /* Inline SVGs coloured via currentColor: solid #070707 at rest. */
    #icon-behance svg,
    #icon-linkedin svg {
      display: block;
      width: 40px;
      height: 40px;
      color: #070707;
      transition: color 0.15s ease;
    }
    /* On hover/tap, both icons switch to the exact accent blue #007CFF */
    #icon-behance:hover svg,
    #icon-behance:active svg,
    #icon-linkedin:hover svg,
    #icon-linkedin:active svg {
      color: #007CFF;
    }

    /* Mobile block screen — shown only on narrow viewports */
    #mobile-block {
      display: none;
      position: fixed;
      inset: 0;
      background: #F5F5F5;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      #mobile-block {
        display: flex;
      }
    }

    #mobile-logo {
      position: absolute;
      top: 40px;
      left: 40px;
      width: calc(100% - 80px);
      height: auto;
      display: block;
    }

    #mobile-block p {
      text-align: center;
      padding: 0 40px;
      font-family: system-ui, sans-serif;
      font-size: 16px;
      color: #bababa;
      line-height: 1.5;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
    }

    #mobile-social {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
    }

    #mobile-icon-behance svg,
    #mobile-icon-linkedin svg {
      display: block;
      width: 60px;
      height: 60px;
      color: #070707;
      transition: color 0.15s ease;
    }

    /* On hover/tap, both mobile icons switch to the exact accent blue #007CFF */
    #mobile-icon-behance:hover svg,
    #mobile-icon-behance:active svg,
    #mobile-icon-linkedin:hover svg,
    #mobile-icon-linkedin:active svg {
      color: #007CFF;
    }
  </style>
</head>

  <div id="app">
    <!-- ====================== Control panel ====================== -->
    <aside id="panel">
      <img src="woodpile01.svg" alt="logo" id="panel-logo">

      <!-- Tier 0: always active. The Upload button lives on the canvas
           overlay until a font loads, then moves in here below the logo. -->
      <div class="control" id="upload-control">
        <input type="file" id="font-input" accept=".otf,.ttf" hidden />
        <div class="error" id="font-error" hidden></div>
      </div>

      <!-- Tier 1: active after a font is loaded -->
      <div class="control">
        <label>Font size <span class="value" id="fontSize-val">150px</span></label>
        <input type="range" id="fontSize" min="72" max="540" step="1" value="150" disabled aria-label="Font size"/>
      </div>

      <div class="control">
        <label>Line height <span class="value" id="lineHeight-val">120%</span></label>
        <input type="range" id="lineHeight" min="50" max="200" step="1" value="120" disabled aria-label="Line height"/>
      </div>

      <!-- Variable-font axis sliders are injected here at load time -->
      <div id="axes-container"></div>

      <div class="control">
        <label>Line thickness <span class="value" id="thickness-val">3px</span></label>
        <input type="range" id="thickness" min="1" max="20" value="3" disabled aria-label="Line thickness"/>
      </div>

      <div class="control">
        <label>Gap <span class="value" id="gap-val">3px</span></label>
        <input type="range" id="gap" min="0" max="10" value="3" disabled aria-label="Gap size"/>
      </div>

      <!-- Angle (0 = horizontal, 90 = vertical) -->
      <div class="control">
        <label>Angle <span class="value" id="angle-val">0°</span></label>
        <input type="range" id="angle" min="0" max="180" step="1" value="0" disabled aria-label="Pattern angle"/>
      </div>

      <button class="action" id="expand-btn" disabled>Expand</button>
      <button class="action secondary" id="clear-btn">Clear canvas</button>

      <!-- Tier 0: keep current settings across Clear (always active) -->
      <label class="checkbox-control">
        <input type="checkbox" id="save-settings" /> Save settings
      </label>

      <!-- ============ Physics section (Tier 2) ============ -->
      <!-- All controls disabled until Expand starts the engine. -->
      <div class="section">
        <h2>Physics</h2>

        <div class="control">
          <label>Air resistance <span class="value" id="frictionAir-val">0.40</span></label>
          <input type="range" id="frictionAir" min="0.2" max="1.0" step="0.01" value="0.4" disabled aria-label="Air friction"/>
        </div>

        <div class="control">
          <label>Bounciness <span class="value" id="restitution-val">0.3</span></label>
          <input type="range" id="restitution" min="0" max="1" step="0.1" value="0.3" disabled aria-label="Bounciness"/>
        </div>

        <div class="control">
          <label>Surface friction <span class="value" id="friction-val">0.1</span></label>
          <input type="range" id="friction" min="0" max="1" step="0.1" value="0.1" disabled aria-label="Surface friction"/>
        </div>

        <div class="control">
          <label>Cursor force <span class="value" id="mouseForceScale-val">0.2</span></label>
          <input type="range" id="mouseForceScale" min="0.1" max="2.0" step="0.1" value="0.2" disabled aria-label="Cursor force"/>
        </div>

        <div class="control">
          <label>Spin <span class="value" id="spin-val">0.80</span></label>
          <input type="range" id="spin" min="0.1" max="1" step="0.05" value="0.8" disabled aria-label="Spin"/>
        </div>

        <button class="action secondary" id="reset-physics-btn" disabled>Reset physics</button>
        <button class="action secondary" id="export-btn" disabled>Export as SVG</button>
      </div>
    </aside>

      </div>
    </div>
  </div>

  <!-- ====================== CDN libraries ====================== -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"
          integrity="sha384-6Twx1hAeKnwfOYJAHtYeJETRiGD5pRPkjjh0pVbG1QoesncjOpw5e75Y1kOkXeRI"
          crossorigin="anonymous"></script>

          crossorigin="anonymous"></script>

  <!-- ====================== App (ES module) ====================== -->
  <script type="module">
    import {
      initPhysics,
      updatePhysics,
      applyMouseForce,
      getBodies,
      destroyPhysics,
      setBodyProperty,
      captureState,
      restoreState,
    } from './physics.js';

    // fontkit (ESM, browser-ready): parses fonts, shapes text, and —
    // crucially — produces variation-applied glyph outlines.
    import * as fontkitNS from 'https://esm.sh/fontkit@2.0.4';
    const fontkit = fontkitNS.default || fontkitNS;

    // ---------------- Constants ----------------
    const MARGIN = 80; // padding around the text block, all sides
    const CURVE_STEPS = 8; // bezier flattening resolution
    const PLACEHOLDER = "Wait for the tea, the fish aren't running!";

    // ---------------- App state ----------------
    const state = {
      fontSize: 150,
      lineHeightPct: 120, // line height as a percentage of font size
      thickness: 3,
      gap: 3,
      angle: 0,          // pattern rotation in degrees (0 = horizontal)
      axes: {},          // { axisTag: value } for variable fonts
      expanded: false,
    };

    // Loaded font + derived render data.
    let font = null;            // base fontkit Font
    let fontInstance = null;    // variation-applied instance (or base font)
    let fontFaceUrl = null;     // blob URL backing the @font-face
    let currentLines = [];      // [{x,y,w,h,angle}] glyph-clipped strokes
    let lastGoodText = '';      // last textarea value that fit vertically

    // Physics config — single source of truth for all tuning.
    const physicsConfig = {
      frictionAir: 0.4,
      restitution: 0.3,
      friction: 0.1,
      mouseForceScale: 0.2,
      spin: 0.8,
    };

    // Slider id -> { default, decimals } for the physics controls.
    const PHYSICS_DEFAULTS = {
      frictionAir: { value: 0.4, decimals: 2 },
      restitution: { value: 0.3, decimals: 1 },
      friction: { value: 0.1, decimals: 1 },
      mouseForceScale: { value: 0.2, decimals: 1 },
      spin: { value: 0.8, decimals: 2 },
    };

    // =========================================================
    // Geometry helpers
    // =========================================================

    // Sample a point on a cubic / quadratic bezier at parameter t.
    function cubicPt(x0, y0, x1, y1, x2, y2, x3, y3, t) {
      const mt = 1 - t;
      const a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
      return { x: a * x0 + b * x1 + c * x2 + d * x3, y: a * y0 + b * y1 + c * y2 + d * y3 };
    }
    function quadPt(x0, y0, x1, y1, x2, y2, t) {
      const mt = 1 - t;
      const a = mt * mt, b = 2 * mt * t, c = t * t;
      return { x: a * x0 + b * x1 + c * x2, y: a * y0 + b * y1 + c * y2 };
    }

    // Flatten a fontkit glyph Path into closed polygons (appended to
    // `out`), mapping every point through `tf` (font units -> canvas px,
    // including the baseline y-flip). Curves are sampled into segments.
    // Interpolating in canvas space is valid because `tf` is affine.
    function pushGlyphPolygons(path, tf, out) {
      let cur = null;
      let cx = 0, cy = 0; // current point, already in canvas space
      for (const c of path.commands) {
        const a = c.args;
        if (c.command === 'moveTo') {
          if (cur && cur.length) out.push(cur);
          const p = tf(a[0], a[1]);
          cur = [p]; cx = p.x; cy = p.y;
        } else if (c.command === 'lineTo') {
          const p = tf(a[0], a[1]);
          cur.push(p); cx = p.x; cy = p.y;
        } else if (c.command === 'quadraticCurveTo') {
          const cp = tf(a[0], a[1]);
          const p = tf(a[2], a[3]);
          for (let i = 1; i <= CURVE_STEPS; i++) {
            cur.push(quadPt(cx, cy, cp.x, cp.y, p.x, p.y, i / CURVE_STEPS));
          }
          cx = p.x; cy = p.y;
        } else if (c.command === 'bezierCurveTo') {
          const c1 = tf(a[0], a[1]);
          const c2 = tf(a[2], a[3]);
          const p = tf(a[4], a[5]);
          for (let i = 1; i <= CURVE_STEPS; i++) {
            cur.push(cubicPt(cx, cy, c1.x, c1.y, c2.x, c2.y, p.x, p.y, i / CURVE_STEPS));
          }
          cx = p.x; cy = p.y;
        } else if (c.command === 'closePath') {
          if (cur && cur.length) out.push(cur);
          cur = null;
        }
      }
      if (cur && cur.length) out.push(cur);
    }

    // Clip an infinite line to a set of polygons and return the spans
    // that fall INSIDE the filled region, using the non-zero winding
    // rule (so glyph counters / holes are correctly excluded).
    //
    // The line passes through (ox, oy) with unit direction (dx, dy);
    // (nx, ny) is the unit normal. Returns an array of [u0, u1] pairs,
    // where u is the signed distance along (dx, dy) from (ox, oy).
    function clipLineToPolygons(ox, oy, dx, dy, nx, ny, polys) {
      const cr = [];
      for (const poly of polys) {
        const m = poly.length;
        for (let i = 0; i < m; i++) {
          const A = poly[i];
          const B = poly[(i + 1) % m];
          const va = (A.x - ox) * nx + (A.y - oy) * ny;
          const vb = (B.x - ox) * nx + (B.y - oy) * ny;
          // Half-open crossing test avoids double-counting shared vertices.
          let dir = 0;
          if (va <= 0 && vb > 0) dir = 1;
          else if (va > 0 && vb <= 0) dir = -1;
          else continue;
          const t = va / (va - vb);
          const ix = A.x + t * (B.x - A.x);
          const iy = A.y + t * (B.y - A.y);
          const u = (ix - ox) * dx + (iy - oy) * dy;
          cr.push({ u, dir });
        }
      }
      if (cr.length < 2) return [];
      cr.sort((p, q) => p.u - q.u);

      const spans = [];
      let wind = 0;
      for (let i = 0; i < cr.length - 1; i++) {
        wind += cr[i].dir;
        if (wind !== 0) spans.push([cr[i].u, cr[i + 1].u]);
      }
      // Merge touching spans so a single stroke stays one rectangle.
      const merged = [];
      for (const s of spans) {
        const last = merged[merged.length - 1];
        if (last && s[0] - last[1] < 1e-6) last[1] = s[1];
        else merged.push([s[0], s[1]]);
      }
      return merged;
    }

    // =========================================================
    // Text layout
    // =========================================================

    // Greedy word-wrap the text into lines that fit the available
    // width, honoring explicit newlines. Returns { lines, lineHeight,
    // height }. Width is measured with the font's own glyph metrics.
    // Pure word-wrap at an EXPLICIT font size: returns just the wrapped
    // lines, depending only on (text, size) and the loaded font. No state
    // reads, no side effects. Line height does NOT affect wrapping — only
    // the vertical block height, which callers compute separately.
    function layoutLinesAtSize(text, size) {
      const availW = p5Instance.width - 2 * MARGIN;
      // Width of `str` in canvas px at the given size.
      const widthPx = (str) => {
        if (!str) return 0;
        const upm = fontInstance.unitsPerEm || font.unitsPerEm;
        return (fontInstance.layout(str).advanceWidth * size) / upm;
      };
      const out = [];

      for (const para of text.split('\n')) {
        if (para.length === 0) { out.push(''); continue; }
        const words = para.split(' ');
        let cur = '';
        for (const word of words) {
          // A word too wide to fit on its own line is broken character
          // by character, mirroring the textarea's word-break: break-word
          // so the caret and the rendered glyphs stay in sync.
          if (widthPx(word) > availW) {
            if (cur !== '') { out.push(cur); cur = ''; }
            let chunk = '';
            for (const ch of word) {
              if (chunk !== '' && widthPx(chunk + ch) > availW) {
                out.push(chunk);
                chunk = ch;
              } else {
                chunk += ch;
              }
            }
            cur = chunk; // partial remainder keeps accumulating words
            continue;
          }
          const test = cur === '' ? word : cur + ' ' + word;
          if (cur !== '' && widthPx(test) > availW) {
            out.push(cur);
            cur = word;
          } else {
            cur = test;
          }
        }
        out.push(cur);
      }
      return out;
    }

    // Current-state wrapper: wraps at the current font size and reports the
    // line height + total block height for the current lineHeightPct.
    function layoutLines(text) {
      const lines = layoutLinesAtSize(text, state.fontSize);
      const lineHeight = state.fontSize * (state.lineHeightPct / 100);
      return { lines, lineHeight, height: lines.length * lineHeight };
    }

    // Does `textInput.value` fit vertically at the given size AND line
    // height? Wrapping depends on size only; line height scales the block
    // height. Same maxH (canvas height - 2*MARGIN) as the typing overflow
    // rule, so both sliders stay consistent with typing behavior.
    function textFits(size, lhPct) {
      const lines = layoutLinesAtSize(textInput.value, size);
      const blockH = lines.length * size * (lhPct / 100);
      return blockH <= (p5Instance.height - 2 * MARGIN);
    }

    // True if `text` fits vertically at the current font size + line
    // height. Wrapping depends on size only; line height scales the block
    // height. Same threshold (canvas height - 2*MARGIN) as the slider clamps.
    function fitsVertically(text) {
      const lines = layoutLinesAtSize(text, state.fontSize);
      const blockH = lines.length * state.fontSize * (state.lineHeightPct / 100);
      return blockH <= (p5Instance.height - 2 * MARGIN);
    }

    // Longest prefix of `text` that fits vertically. Trims whole words from
    // the END first; if not even one word fits (or a single word is
    // overlong), grows character by character to keep the maximum that fits.
    function truncateToFit(text) {
      if (fitsVertically(text)) return text;

      // 1) Try trimming whole words from the end.
      const words = text.split(/(\s+)/); // keep separators as tokens
      let built = '';
      let lastFit = '';
      for (const token of words) {
        const candidate = built + token;
        if (fitsVertically(candidate)) {
          built = candidate;
          if (token.trim() !== '') lastFit = built; // record at word ends
        } else {
          break;
        }
      }
      // Prefer the last whole-word boundary that fit.
      let result = lastFit || '';

      // 2) If not even one word fit, or a single overlong word remains,
      //    grow character by character from result.
      let charCandidate = result;
      for (let i = result.length; i < text.length; i++) {
        const next = charCandidate + text[i];
        if (fitsVertically(next)) charCandidate = next;
        else break;
      }
      return charCandidate;
    }

    // =========================================================
    // Pattern construction
    // =========================================================

    // Rebuild the glyph-clipped line rectangles from the current text,
    // font, size, axes and pattern sliders. Stores the result in
    // currentLines (drawn each frame and fed to Expand).
    function rebuildPattern() {
      currentLines = [];
      if (!fontInstance) return;

      const { lines, lineHeight } = layoutLines(textInput.value);
      const upm = fontInstance.unitsPerEm || font.unitsPerEm;
      const scale = state.fontSize / upm;
      const firstBaseline = MARGIN + fontInstance.ascent * scale;

      // Collect every (variation-applied) glyph contour as a polygon.
      const polys = [];
      for (let i = 0; i < lines.length; i++) {
        if (!lines[i]) continue;
        const baselineY = firstBaseline + i * lineHeight;
        addLinePolygons(lines[i], MARGIN, baselineY, scale, polys);
      }
      if (!polys.length) return;

      currentLines = linesFromPolygons(polys);
    }

    // Shape one line with fontkit and append all its glyph contours (as
    // canvas-space polygons) to `out`. Glyph paths are in font units,
    // y-up; we scale by `scale` and flip y about the baseline.
    function addLinePolygons(text, originX, baselineY, scale, out) {
      const run = fontInstance.layout(text);
      let penX = 0;
      for (let i = 0; i < run.glyphs.length; i++) {
        const glyph = run.glyphs[i];
        const pos = run.positions[i];
        const gx = penX + pos.xOffset;
        const gy = pos.yOffset;
        const tf = (x, y) => ({
          x: originX + (gx + x) * scale,
          y: baselineY - (gy + y) * scale,
        });
        if (glyph.path && glyph.path.commands.length) {
          pushGlyphPolygons(glyph.path, tf, out);
        }
        penX += pos.xAdvance;
      }
    }

    // Intersect the parallel-line pattern with the glyph polygons and
    // return one rectangle per visible span: [{x,y,w,h,angle}] where
    // x/y is the segment CENTER, w = length, h = thickness, angle in
    // radians. Lines run along d = (cos a, sin a) and are stacked along
    // the normal n = (-sin a, cos a), spaced (thickness + gap) apart,
    // anchored to a fixed grid through the origin so the stripes stay
    // stable while editing.
    function linesFromPolygons(polys) {
      const rects = [];
      const t = state.thickness;
      const step = t + state.gap;
      const a = (state.angle * Math.PI) / 180;

      const dx = Math.cos(a), dy = Math.sin(a);
      const nx = -Math.sin(a), ny = Math.cos(a);

      // Range of perpendicular offsets that cover the glyph bbox.
      let sMin = Infinity, sMax = -Infinity;
      for (const poly of polys) {
        for (const v of poly) {
          const s = v.x * nx + v.y * ny;
          if (s < sMin) sMin = s;
          if (s > sMax) sMax = s;
        }
      }

      const kStart = Math.ceil(sMin / step);
      const kEnd = Math.floor(sMax / step);
      for (let k = kStart; k <= kEnd; k++) {
        const s = k * step;
        const ox = s * nx;
        const oy = s * ny;
        const spans = clipLineToPolygons(ox, oy, dx, dy, nx, ny, polys);
        for (const [u0, u1] of spans) {
          const len = u1 - u0;
          if (len <= 0) continue;
          const um = (u0 + u1) / 2;
          rects.push({
            x: ox + um * dx,
            y: oy + um * dy,
            w: len,
            h: t,
            angle: a,
          });
        }
      }
      return rects;
    }

    // Drives the physics step + mouse interaction. Set true the moment
    // Expand finishes wiring the bodies; the engine is stepped once per
    // rendered frame from draw() (no runner/timer).
    let physicsActive = false;

    // Undo/redo history for cursor interactions. One action = one drag
    // (mousePressed -> mouseReleased). pendingSnapshot holds the state
    // captured at press, committed to undoStack on release.
    const undoStack = [];
    const redoStack = [];
    const HISTORY_LIMIT = 50;
    let pendingSnapshot = null;

    // =========================================================
    // p5 sketch (instance mode so it cohabits with ES modules).
    // =========================================================
    const sketch = (p) => {
      let host;

      p.setup = () => {
        host = document.getElementById('canvas-host');
        const c = p.createCanvas(host.clientWidth, host.clientHeight);
        c.parent(host);
        p.rectMode(p.CENTER);
        p.noStroke();
      };

      p.windowResized = () => {
        p.resizeCanvas(host.clientWidth, host.clientHeight);
        // Available width/height changed: re-fit and rebuild.
        if (font && !state.expanded) {
          const fitted = truncateToFit(textInput.value);
          if (fitted !== textInput.value) textInput.value = fitted;
          lastGoodText = textInput.value;
          rebuildPattern();
        }
      };

      p.draw = () => {
        // Step the simulation once per frame, before drawing.
        if (physicsActive) updatePhysics();

        p.background('#F5F5F5');

        if (!font) {
          // Placeholder until a font is uploaded.
          p.push();
          p.fill('#bababa');
          p.textAlign(p.CENTER, p.CENTER);
          p.textSize(22);
          p.textFont('sans-serif');
          p.text(PLACEHOLDER, p.width / 2, p.height / 2);
          p.pop();
          return;
        }

        p.fill('#070707');
        p.noStroke();
        const arr = physicsActive ? getBodies() : currentLines;
        for (const r of arr) {
          p.push();
          p.translate(r.x, r.y);
          p.rotate(r.angle);
          p.rect(0, 0, r.w, r.h);
          p.pop();
        }
      };

      // Cursor interaction: force is applied while the mouse button is
      // held and the cursor moves. p5 fires mouseDragged (not mouseMoved)
      // during a held-button drag, with accurate per-event velocity.
      p.mouseDragged = () => {
        if (!physicsActive) return;
        const vx = p.mouseX - p.pmouseX;
        const vy = p.mouseY - p.pmouseY;
        applyMouseForce(p.mouseX, p.mouseY, vx, vy);
      };

      // Undo/redo drag boundaries: snapshot BEFORE the push at press,
      // commit it to the undo stack at release.
      p.mousePressed = () => {
        if (!physicsActive) return;
        pendingSnapshot = captureState();
      };
      p.mouseReleased = () => {
        if (!physicsActive || !pendingSnapshot) return;
        undoStack.push(pendingSnapshot);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack.length = 0; // a new action invalidates the redo branch
        pendingSnapshot = null;
      };
    };

    const p5Instance = new p5(sketch);

    // =========================================================
    // Undo (Cmd/Ctrl+Z) / Redo (Cmd/Ctrl+Shift+Z) for drag actions.
    // =========================================================
    window.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod || e.key.toLowerCase() !== 'z') return;
      if (!physicsActive) return;

      if (e.shiftKey) {
        // Redo
        if (redoStack.length === 0) return;
        e.preventDefault();
        const next = redoStack.pop();
        // Save current state so this redo can be undone again.
        undoStack.push(captureState());
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        restoreState(next);
      } else {
        // Undo
        if (undoStack.length === 0) return;
        e.preventDefault();
        const prev = undoStack.pop();
        // Save current state so it can be redone.
        redoStack.push(captureState());
        if (redoStack.length > HISTORY_LIMIT) redoStack.shift();
        restoreState(prev);
      }
    });

    // =========================================================
    // Control panel wiring
    // =========================================================
    const uploadBtn = document.getElementById('upload-btn');
    const uploadControl = document.getElementById('upload-control');
    const uploadOverlay = document.getElementById('upload-overlay');
    const fontInput = document.getElementById('font-input');
    const fontError = document.getElementById('font-error');
    const axesContainer = document.getElementById('axes-container');
    const textInput = document.getElementById('text-input');

    const fontSizeInput = document.getElementById('fontSize');
    const lineHeightInput = document.getElementById('lineHeight');
    const thicknessInput = document.getElementById('thickness');
    const gapInput = document.getElementById('gap');
    const angleInput = document.getElementById('angle');
    const fontSizeVal = document.getElementById('fontSize-val');
    const lineHeightVal = document.getElementById('lineHeight-val');
    const thicknessVal = document.getElementById('thickness-val');
    const gapVal = document.getElementById('gap-val');
    const angleVal = document.getElementById('angle-val');

    const expandBtn = document.getElementById('expand-btn');
    const clearBtn = document.getElementById('clear-btn');
    const saveSettingsInput = document.getElementById('save-settings');
    const exportBtn = document.getElementById('export-btn');
    const resetPhysicsBtn = document.getElementById('reset-physics-btn');
    const physicsInputs = Object.keys(PHYSICS_DEFAULTS).map((key) =>
      document.getElementById(key)
    );

    // ---- Tier enable/disable ----------------------------------
    // Tier 1 includes the dynamically-created axis sliders.
    function tier1Controls() {
      return [
        fontSizeInput, lineHeightInput, thicknessInput, gapInput, angleInput, expandBtn,
        ...axesContainer.querySelectorAll('.axis-input'),
      ];
    }
    function setTier1Enabled(en) {
      tier1Controls().forEach((c) => (c.disabled = !en));
    }
    function setTier2Enabled(en) {
      physicsInputs.forEach((i) => (i.disabled = !en));
      resetPhysicsBtn.disabled = !en;
      exportBtn.disabled = !en;
    }

    // ---- Range slider fill --------------------------------------
    // WebKit has no ::progress pseudo, so paint the filled portion with a
    // gradient. (Firefox uses ::-moz-range-progress; the gradient is
    // harmless there.) Call after any value change, user or programmatic.
    function paintRangeFill(el) {
      const min = parseFloat(el.min) || 0;
      const max = parseFloat(el.max) || 100;
      const pct = ((parseFloat(el.value) - min) / (max - min)) * 100;
      el.style.background =
        `linear-gradient(to right, #007CFF 0%, #007CFF ${pct}%,` +
        ` #d8d8d8 ${pct}%, #d8d8d8 100%)`;
    }

    // Every static range slider paints itself on input; axis sliders wire
    // this up as they're created. Initial paint happens on load below.
    document.querySelectorAll('input[type="range"]').forEach((el) => {
      el.addEventListener('input', (e) => paintRangeFill(e.target));
      paintRangeFill(el);
    });

    // =========================================================
    // Font upload (Tier 0)
    // =========================================================
    uploadBtn.addEventListener('click', () => fontInput.click());

    // Show the loaded font name on the button. Only the .label span text
    // changes; the upload-simple icon (in the HTML) stays to its right.
    function setUploadLabel(name) {
      uploadBtn.querySelector('.label').textContent = name;
    }

    // Shared font-loading path for both the file picker and drag-and-drop.
    async function loadFontFile(file) {
      if (!file) return;
      const name = file.name.toLowerCase();
      if (!name.endsWith('.otf') && !name.endsWith('.ttf')) {
        showFontError();
        return;
      }
      // Parse first, commit after: if the new file is corrupt, the
      // previously loaded font (if any) stays fully intact — state, UI,
      // @font-face and axis sliders are only touched on success.
      let parsed;
      try {
        const buf = await file.arrayBuffer();
        parsed = fontkit.create(new Uint8Array(buf));
        // A font collection (.ttc) resolves to its first face.
        if (typeof parsed.layout !== 'function' && parsed.fonts) {
          parsed = parsed.fonts[0];
        }
      } catch (err) {
        showFontError();
        return;
      }

      font = parsed;
      fontError.hidden = true;

      injectFontFace(file);

      // First load: move the button off the canvas overlay into the left
      // panel (below the logo) and hide the overlay. Idempotent on reload.
      uploadControl.insertBefore(uploadBtn, fontInput);
      uploadOverlay.style.display = 'none';
      setUploadLabel(fontDisplayName(parsed) || file.name);

      buildAxisSliders(parsed);
      updateFontInstance();

      setTier1Enabled(true);
      textInput.hidden = false;
      textInput.style.fontFamily = "'UploadedFont', sans-serif";
      textInput.style.fontSize = state.fontSize + 'px';
      applyVariationCSS();
      textInput.focus();
      rebuildPattern();
    }

    fontInput.addEventListener('change', async (e) => {
      await loadFontFile(e.target.files[0]);
      // Allow re-uploading the same file later.
      fontInput.value = '';
    });

    // Drag-and-drop onto the canvas, active only in the placeholder state
    // (before any font is loaded). preventDefault always runs first — a
    // stray drop must never navigate the page away and lose the user's
    // work. The window-level guards cover drops outside the canvas (e.g.
    // on the control panel).
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    const canvasHost = document.getElementById('canvas-host');
    canvasHost.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (font) return;
      canvasHost.classList.add('drag-active');
    });
    canvasHost.addEventListener('dragleave', () => {
      canvasHost.classList.remove('drag-active');
    });
    canvasHost.addEventListener('drop', (e) => {
      e.preventDefault();
      canvasHost.classList.remove('drag-active');
      if (font) return;
      loadFontFile(e.dataTransfer.files[0]);
    });

    function showFontError() {
      fontError.textContent = 'Unsupported format. Please use OTF or TTF.';
      fontError.hidden = false;
    }

    function fontDisplayName(f) {
      return f.fullName || f.familyName || f.postscriptName || null;
    }

    function injectFontFace(file) {
      if (fontFaceUrl) URL.revokeObjectURL(fontFaceUrl);
      fontFaceUrl = URL.createObjectURL(file);
      let st = document.getElementById('uploaded-font-face');
      if (!st) {
        st = document.createElement('style');
        st.id = 'uploaded-font-face';
        document.head.appendChild(st);
      }
      st.textContent =
        `@font-face { font-family: 'UploadedFont'; src: url('${fontFaceUrl}'); }`;
    }

    // =========================================================
    // Variable-font axis sliders
    // =========================================================
    function buildAxisSliders(f) {
      axesContainer.innerHTML = '';
      state.axes = {};

      const axes = f.variationAxes;
      if (!axes || !Object.keys(axes).length) return;

      for (const [tag, ax] of Object.entries(axes)) {
        const label = ax.name || tag;
        const min = ax.min;
        const max = ax.max;
        const def = ax.default;
        const step = (max - min) < 10 ? 0.1 : 1;
        state.axes[tag] = def;

        const div = document.createElement('div');
        div.className = 'control';
        // Build the label with DOM APIs only: the axis name and tag come
        // from the uploaded font file (untrusted), so they must never be
        // parsed as HTML.
        const lab = document.createElement('label');
        lab.textContent = `${label} `;
        const valSpan = document.createElement('span');
        valSpan.className = 'value';
        valSpan.textContent = def;
        lab.appendChild(valSpan);
        const input = document.createElement('input');
        input.type = 'range';
        input.min = min; input.max = max; input.step = step; input.value = def;
        input.className = 'axis-input';
        input.id = `axis-${tag}`;
        input.dataset.tag = tag;

        div.appendChild(lab);
        div.appendChild(input);
        axesContainer.appendChild(div);
        paintRangeFill(input); // initial blue fill for the new slider

        input.addEventListener('input', () => {
          const v = Number(input.value);
          state.axes[tag] = v;
          valSpan.textContent = v;
          paintRangeFill(input);
          updateFontInstance();
          applyVariationCSS();
          rebuildPattern();
        });
      }
    }

    // Recompute the variation-applied font instance from state.axes.
    // Static fonts (no axes) just use the base font.
    function updateFontInstance() {
      if (!font) { fontInstance = null; return; }
      const hasAxes = font.variationAxes && Object.keys(font.variationAxes).length;
      fontInstance = hasAxes ? font.getVariation(state.axes) : font;
    }

    // Mirror the axis values onto the textarea overlay via CSS so the
    // caret tracks the variation; the canvas glyphs are reshaped for
    // real by fontkit's getVariation().
    function applyVariationCSS() {
      const parts = Object.entries(state.axes).map(([t, v]) => `"${t}" ${v}`);
      textInput.style.fontVariationSettings = parts.join(', ');
    }

    // =========================================================
    // Tier 1 sliders
    // =========================================================
    fontSizeInput.addEventListener('input', () => {
      // Growing must never delete text: clamp to the largest size that
      // still fits. Shrinking is always allowed.
      const requested = parseInt(fontSizeInput.value, 10);
      const current = state.fontSize;
      if (requested > current) {
        if (textFits(requested, state.lineHeightPct)) {
          state.fontSize = requested;
        } else {
          let lo = current, hi = requested, best = current;
          while (lo <= hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (textFits(mid, state.lineHeightPct)) { best = mid; lo = mid + 1; }
            else { hi = mid - 1; }
          }
          state.fontSize = best;
          fontSizeInput.value = best;
        }
      } else {
        state.fontSize = requested;
      }
      fontSizeVal.textContent = `${state.fontSize}px`;
      textInput.style.fontSize = state.fontSize + 'px';
      paintRangeFill(fontSizeInput); // reflect any clamp snap-back
      rebuildPattern();
    });

    lineHeightInput.addEventListener('input', () => {
      // Growing must never delete text: clamp to the largest line height
      // that still fits. Shrinking is always allowed.
      const requested = parseInt(lineHeightInput.value, 10);
      const current = state.lineHeightPct;
      if (requested > current) {
        if (textFits(state.fontSize, requested)) {
          state.lineHeightPct = requested;
        } else {
          let lo = current, hi = requested, best = current;
          while (lo <= hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (textFits(state.fontSize, mid)) { best = mid; lo = mid + 1; }
            else { hi = mid - 1; }
          }
          state.lineHeightPct = best;
          lineHeightInput.value = best;
        }
      } else {
        state.lineHeightPct = requested;
      }
      lineHeightVal.textContent = `${state.lineHeightPct}%`;
      textInput.style.lineHeight = state.lineHeightPct / 100;
      paintRangeFill(lineHeightInput); // reflect any clamp snap-back
      rebuildPattern();
    });

    thicknessInput.addEventListener('input', () => {
      state.thickness = Number(thicknessInput.value);
      thicknessVal.textContent = `${state.thickness}px`;
      rebuildPattern();
    });

    gapInput.addEventListener('input', () => {
      state.gap = Number(gapInput.value);
      gapVal.textContent = `${state.gap}px`;
      rebuildPattern();
    });

    angleInput.addEventListener('input', () => {
      state.angle = Number(angleInput.value);
      angleVal.textContent = `${state.angle}°`;
      rebuildPattern();
    });

    // Text input: never delete already-accepted text on vertical overflow.
    // A fitting value is accepted as-is; an overflowing one (an overflowing
    // keystroke, or a large paste) is truncated to the maximum prefix that
    // fits, and the caret is clamped into the shorter text.
    textInput.addEventListener('input', () => {
      const val = textInput.value;
      if (fitsVertically(val)) {
        lastGoodText = val;                 // accept as-is
      } else {
        const caret = textInput.selectionStart;
        const fitted = truncateToFit(val);
        textInput.value = fitted;
        lastGoodText = fitted;
        // Clamp caret into the new (shorter) text.
        const pos = Math.min(caret, fitted.length);
        textInput.setSelectionRange(pos, pos);
      }
      rebuildPattern();
    });

    // =========================================================
    // Expand: glyph outlines -> physics bodies
    // =========================================================
    expandBtn.addEventListener('click', () => {
      if (state.expanded || !font) return;
      rebuildPattern();
      if (!currentLines.length) return; // nothing to outline

      initPhysics(currentLines, physicsConfig);
      undoStack.length = 0; redoStack.length = 0; pendingSnapshot = null;
      state.expanded = true;
      physicsActive = true;

      textInput.hidden = true;
      setTier1Enabled(false);
      setTier2Enabled(true);
    });

    // =========================================================
    // SVG export — current positions & rotations of every rect.
    // =========================================================
    exportBtn.addEventListener('click', () => {
      if (!state.expanded) return;

      const w = p5Instance.width;
      const h = p5Instance.height;
      // Background rectangle first, behind all pattern rectangles.
      let rects =
        `  <rect x="0" y="0" width="${w}" height="${h}" fill="#F5F5F5" />\n`;

      for (const b of getBodies()) {
        const x = b.x - b.w / 2;
        const y = b.y - b.h / 2;
        const deg = (b.angle * 180) / Math.PI;
        rects +=
          `  <rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" ` +
          `width="${b.w.toFixed(2)}" height="${b.h.toFixed(2)}" ` +
          `fill="#070707" ` +
          `transform="rotate(${deg.toFixed(2)} ${b.x.toFixed(2)} ${b.y.toFixed(2)})" />\n`;
      }

      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" ` +
        `width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n${rects}</svg>\n`;

      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pattern.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    // =========================================================
    // Clear canvas. Both branches stop physics and empty the text; the
    // font is never unloaded here.
    //   • Save settings CHECKED  -> keep every Tier 1 value; just clear text.
    //   • Save settings UNCHECKED -> reset all parameters to defaults, but
    //     keep the font, @font-face, axis sliders, and the upload button.
    // =========================================================
    clearBtn.addEventListener('click', () => {
      // Both cases: stop physics, remove all bodies, empty the text,
      // and clear the undo/redo history.
      physicsActive = false;
      destroyPhysics();
      undoStack.length = 0; redoStack.length = 0; pendingSnapshot = null;
      state.expanded = false;
      textInput.value = '';
      lastGoodText = '';

      // ---- Save settings CHECKED: clear text only, keep every value. ----
      if (saveSettingsInput.checked) {
        textInput.hidden = false;
        setTier1Enabled(true);
        setTier2Enabled(false);
        textInput.focus();
        rebuildPattern();
        return;
      }

      // ---- Save settings UNCHECKED: reset all parameters to defaults. ----
      // The font, @font-face, axis sliders, and the upload button are left
      // untouched — the font can only be changed via the Upload button.

      // Sliders + font size back to defaults.
      state.fontSize = 150; fontSizeInput.value = '150'; fontSizeVal.textContent = '150px';
      state.lineHeightPct = 120; lineHeightInput.value = '120'; lineHeightVal.textContent = '120%';
      state.thickness = 3; thicknessInput.value = '3'; thicknessVal.textContent = '3px';
      state.gap = 3; gapInput.value = '3'; gapVal.textContent = '3px';
      state.angle = 0; angleInput.value = '0'; angleVal.textContent = '0°';
      textInput.style.fontSize = '150px';
      textInput.style.lineHeight = '1.2';
      [fontSizeInput, lineHeightInput, thicknessInput, gapInput, angleInput]
        .forEach(paintRangeFill);

      // Physics back to defaults.
      resetPhysicsToDefaults();

      // Physics is stopped and Tier 2 is disabled, but the font stays loaded
      // so Tier 1 controls remain enabled and the user can keep typing.
      textInput.hidden = false;
      setTier1Enabled(true);
      setTier2Enabled(false);
      textInput.focus();

      rebuildPattern();
    });

    // =========================================================
    // Physics section wiring (unchanged behavior)
    // =========================================================
    function setPhysicsValue(key, value) {
      const decimals = PHYSICS_DEFAULTS[key].decimals;
      document.getElementById(`${key}-val`).textContent = value.toFixed(decimals);
      if (key === 'mouseForceScale') {
        physicsConfig.mouseForceScale = value; // read live by applyMouseForce
      } else {
        setBodyProperty(key, value); // apply to live bodies + update config
      }
    }

    Object.keys(PHYSICS_DEFAULTS).forEach((key) => {
      const input = document.getElementById(key);
      input.addEventListener('input', () => {
        setPhysicsValue(key, Number(input.value));
      });
    });

    function resetPhysicsToDefaults() {
      Object.entries(PHYSICS_DEFAULTS).forEach(([key, def]) => {
        const el = document.getElementById(key);
        el.value = String(def.value);
        setPhysicsValue(key, def.value);
        paintRangeFill(el);
      });
    }

    resetPhysicsBtn.addEventListener('click', resetPhysicsToDefaults);
  </script>
</body>
</html>
